version: 1
plan:
  name: 'Forge TUI surface — complete AGENTS.md §28 (6 remaining panels + 11 slash commands + 3x4 dashboard host)'
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 8
  auto_accept: false
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0

tasks:
  - id: t51-six-remaining-panels
    title: '6 read-only TUI panels — Probe, Contradiction, Decision, Checkpoint, PR Readiness, Cost'
    prompt: |
      Add 6 new read-only TUI panels to packages/forge-tui/src/panels/. Each follows
      the exact same contract as the 6 already-shipped panels (TaskPanel, BeliefPanel,
      VerificationPanel, EvidencePanel, TracePanel, FailurePanel) — class with
      `render(width, height): string` and `handleKey(key): void`, backed by a typed
      fixture interface so panels are testable without Postgres.

      Read packages/forge-tui/src/panels/BeliefPanel.ts and EvidencePanel.ts first
      to match the existing patterns (fixture interface, default fixture factory,
      snapshot-test style).

      Panels to add (each backed by the same typed-fixture pattern):

      1. **ProbePanel** — `packages/forge-tui/src/panels/ProbePanel.ts`
         Fixture: `ProbePanelFixture` with `probes: Array<{ id: string, claimId: string,
         rationale: string, expectedEvidenceKind: string, priorityScore: number,
         blocked: boolean }>`. Render: ordered list with priority bars, rationale on
         hover, blocked probes greyed. handleKey: 'j'/'k' for next/prev probe,
         'd' to mark done (no-op stub).

      2. **ContradictionPanel** — `packages/forge-tui/src/panels/ContradictionPanel.ts`
         Fixture: `ContradictionPanelFixture` with `contradictions: Array<{ id,
         claimId, evidenceId, note, raisedAt }>` and `staleClaims: Array<{
         claimId, taskId, lastEvidenceAt, reason }>`. Render: two sections —
         Open Contradictions (sorted by raisedAt desc) and Stale Claims (sorted by
         reason severity). handleKey: 'j'/'k' to move, 'r' to mark resolved (no-op).

      3. **DecisionPanel** — `packages/forge-tui/src/panels/DecisionPanel.ts`
         Fixture: `DecisionPanelFixture` with `decisions: Array<{ id, taskId,
         summary, rationale, alternativesRejected: string[], verificationRequired:
         string[], madeAt }>`. Render: chronological list, expand 'e' to show
         rationale + rejected alternatives + verification obligations.

      4. **CheckpointPanel** — `packages/forge-tui/src/panels/CheckpointPanel.ts`
         Fixture: `CheckpointPanelFixture` with `candidates: Array<{ id, hypothesis,
         filesChanged: string[], reason, testResult, verificationStatus, promoted:
         boolean }>`. Render: candidates with promotion status badges; promoted ones
         highlighted. handleKey: 'p' to mark promoted (no-op).

      5. **PrReadinessPanel** — `packages/forge-tui/src/panels/PrReadinessPanel.ts`
         Fixture: `PrReadinessPanelFixture` with `checklist: Array<{ item,
         status: 'pass'|'fail'|'pending'|'na', note? }>`, `unresolvedReviewComments:
         number`, `riskAreas: string[]`. Render: checklist with status icons,
         unresolved-comment count, risk-area tags. handleKey: 'j'/'k' to scroll.

      6. **CostPanel** — `packages/forge-tui/src/panels/CostPanel.ts`
         Fixture: `CostPanelFixture` with `stages: Array<{ name,
         inputTokens, outputTokens, runtimeMs, costUsd }>`, `totals: { inputTokens,
         outputTokens, runtimeMs, costUsd }`. Render: stage breakdown table +
         totals row. handleKey: 's' to sort by stage name OR cost (toggle).

      **Export all 6 from packages/forge-tui/src/index.ts** with both the class and
      the Fixture type, matching the existing panel export style.

      **Tests at packages/forge-tui/tests/panels-additional.test.ts**:
      12 snapshot tests across the 6 panels (2 per panel: empty fixture, populated
      fixture). Match the existing tests/tui-panels.test.ts snapshot style.

      **EXIT CODE DISCIPLINE**: `pnpm -r clean && pnpm -r build > /tmp/build.log 2>&1;
      echo "exit=$?"; grep -c "Failed\|error TS" /tmp/build.log` — pipe-mask rot
      bit us twice in the previous plan. Same for vitest: `pnpm exec vitest run
      > /tmp/test.log 2>&1; echo "exit=$?"; tail -5 /tmp/test.log`.

      30-minute budget. Report commit hash. STOP conditions: workspace build clean,
      all new tests green, all 6 panels exported from index.ts.
    assigned_to: general
    verified_by: verifier
    verify_prompt: |
      STEP ZERO (mandatory): `cd /Users/coenhewes/Documents/Forge-code/Forge-coding
      && pnpm -r clean && pnpm -r build > /tmp/build.log 2>&1; echo "exit=$?"` —
      FAIL hard if exit != 0 OR if the log contains 'error TS' or 'Failed'. Catches
      the workspace-level tsbuildinfo staleness that bit us twice before.

      STEP 1: `pnpm test > /tmp/test.log 2>&1; echo "exit=$?"; grep -E "Tests +
      [0-9]+ passed" /tmp/test.log | tail -3` — assert exit 0 and at least 12 new
      tests passed (2 per panel × 6 panels).

      STEP 2: Open packages/forge-tui/src/index.ts and assert ALL 6 panel exports
      are present with both class and Fixture type: ProbePanel, ContradictionPanel,
      DecisionPanel, CheckpointPanel, PrReadinessPanel, CostPanel.

      STEP 3: For each of the 6 panels, assert render(width, height) returns a
      non-empty string given a populated fixture (the producer's test should
      already cover this — spot-check 2 panels by running the snapshot test in
      isolation).

      STEP 4: Adversarial — for each panel, call render(0, 0) or render(-1, -1)
      and assert it does NOT throw. The fixtures must guard against degenerate
      sizes.

      STEP 5: Open packages/forge-tui/tests/panels-additional.test.ts and assert
      it exists with at least 12 tests (count `it(` calls).
    timeout_ms: 1800000

  - id: t52-eleven-slash-commands
    title: '11 slash commands — /belief /probes /verify /failures /trace /pr /doctor /sessions /mode /budget /compact'
    prompt: |
      Add 11 slash commands to packages/forge-tui/src/repl.ts to complete the
      AGENTS.md §28 spec. The file already has 13 commands (help, setup, model,
      provider, init, status, tasks, resume, checkpoint, evidence, dashboard,
      clear, quit) — read it first to match the registration style.

      Add these 11 new commands to the `registerCommands()` array, each with
      `name`, `aliases: []`, `description`, `usage`, and `handler`:

      1. `/belief` — print current task's belief state (top 3 hypotheses with
         confidence bars). Read from TaskStateEngine if available, else print
         "no active task".
      2. `/probes` — print ProbePanel-equivalent list. Read from state store,
         print ordered by priority score desc.
      3. `/verify` — print open verification matrix for current task. Read from
         VerificationMatrixEngine, group by status (pending/passed/failed).
      4. `/failures` — print failed attempts + disproven hypotheses from
         FailureLedgerEngine. Most recent first.
      5. `/trace` — print last 20 trace events as a timeline. Read from state
         store's trace_events table.
      6. `/pr` — call PR generator and print the markdown to stdout (do not
         open a file). Use the t60a PRGenerator.generatePRSummary.
      7. `/doctor` — call into the doctor CLI command (or its underlying check
         function) and print results. Equivalent to running `forge doctor` inline.
      8. `/sessions` — list tasks from state store with status + risk level.
         Equivalent to `forge sessions`.
      9. `/mode <implement|repair|review|maintain|research>` — set the agent
         mode on the active session. Persist via state store. Print
         confirmation.
      10. `/budget <n>` — set token budget for current run. Persist via state
          store. Print confirmation.
      11. `/compact` — force context compaction on the active session. Call
          AgentLoop.compact() if it exists, else print "compaction not available
          in this build".

      Implementation rules:
      - Each handler must be a function `async (args: string[]) => Promise<void>`.
      - Use `this.logLine(text)` to write to the REPL output (find the existing
        helper — if absent, use `this.logLines.push(text)`).
      - For commands that take args (mode, budget), parse args[0] and validate.
        Print usage hint and return on invalid input.
      - For commands that read from state, gracefully handle "no active task"
        / "state store not initialized" with a clear message, not a crash.

      Tests at packages/forge-tui/tests/slash-commands.test.ts:
      - 11 tests, one per command, each verifying the handler doesn't throw
        and produces expected output for both empty and populated fixtures.
      - For /mode and /budget, test invalid input rejection.
      - For /compact, test graceful "not available" handling when AgentLoop
        lacks the method.

      EXIT CODE DISCIPLINE: `pnpm -r clean && pnpm -r build > /tmp/build.log
      2>&1; echo "exit=$?"; grep -c "Failed\|error TS" /tmp/build.log`.
      Tests: `pnpm exec vitest run > /tmp/test.log 2>&1; echo "exit=$?"`.

      30-minute budget. Report commit hash.
    assigned_to: general
    verified_by: verifier
    verify_prompt: |
      STEP ZERO: `cd /Users/coenhewes/Documents/Forge-code/Forge-coding && pnpm -r
      clean && pnpm -r build > /tmp/build.log 2>&1; echo "exit=$?"` — FAIL hard
      if exit != 0.

      STEP 1: `pnpm test > /tmp/test.log 2>&1; echo "exit=$?"; grep -E "Tests +
      [0-9]+ passed" /tmp/test.log | tail -3` — assert exit 0 and new
      slash-commands.test.ts passed.

      STEP 2: Open packages/forge-tui/src/repl.ts. Grep for all 11 command names
      in `name: 'X'` patterns (or equivalent registration):
      belief, probes, verify, failures, trace, pr, doctor, sessions, mode,
      budget, compact. Assert all 11 present.

      STEP 3: For each of the 11 commands, assert the handler is an async
      function (handler declaration includes async OR returns a Promise).

      STEP 4: Adversarial — invoke `/mode invalid_mode` and `/budget abc` via
      the test suite. Assert the handlers print usage hint and return without
      crashing.

      STEP 5: Assert total command count in registerCommands() is now 24
      (13 existing + 11 new).
    timeout_ms: 1800000

  - id: t53-extend-dashboard-grid
    title: 'Extend PanelsDashboard host from 3x2 to 3x4 grid (12 panels: 6 existing + 6 new)'
    prompt: |
      Extend the existing PanelsDashboard host at
      packages/forge-tui/src/panels-dashboard.ts from a 3×2 grid (6 panels) to a
      3×4 grid (12 panels = 6 existing + 6 new from t51).

      The 6 existing panels stay in their positions (Task/Belief/Verify on row 1,
      Evidence/Trace/Failures on row 2). The 6 new panels go on rows 3 and 4 in
      this order:

      Row 3: ProbePanel, ContradictionPanel, DecisionPanel
      Row 4: CheckpointPanel, PrReadinessPanel, CostPanel

      Update:
      1. `PanelsDashboardFixtures` interface — add the 6 new fixture fields
         (probe, contradiction, decision, checkpoint, prReadiness, cost).
      2. `PanelsDashboard` class — add the 6 new panel instance fields (readonly)
         and wire them into the blessed grid (3 rows × 4 cols) and `renderAll()`.
      3. `render(width, height)` — handle the new aspect ratio (taller layout);
         if height < 24, fall back to a 2-row × 6-col compact layout (graceful
         degradation for small terminals).
      4. Add a `renderRow(rowIndex: 0|1|2|3, width: number, height: number)`
         helper that returns just one row of 3 panels as a string — useful for
         snapshot tests.

      Update tests at packages/forge-tui/tests/tui-panels.test.ts to assert:
      - The 3×4 grid renders correctly with all 12 panels populated
      - The 2×6 fallback renders correctly when height=20
      - renderRow(0/1/2/3, 80, 12) returns expected shape

      Add 4 new snapshot tests for the 3×4 layout (full, empty fixtures, compact
      fallback, single-row extraction).

      EXIT CODE DISCIPLINE: `pnpm -r clean && pnpm -r build > /tmp/build.log
      2>&1; echo "exit=$?"; grep -c "Failed\|error TS" /tmp/build.log`.

      30-minute budget. Report commit hash. STOP conditions: 3×4 grid renders,
      fallback works, all tests green, dashboard still exports cleanly.
    assigned_to: general
    verified_by: verifier
    verify_prompt: |
      STEP ZERO: `cd /Users/coenhewes/Documents/Forge-code/Forge-coding && pnpm -r
      clean && pnpm -r build > /tmp/build.log 2>&1; echo "exit=$?"` — FAIL hard
      if exit != 0.

      STEP 1: `pnpm test > /tmp/test.log 2>&1; echo "exit=$?"; grep -E "Tests +
      [0-9]+ passed" /tmp/test.log | tail -3` — assert exit 0.

      STEP 2: Open packages/forge-tui/src/panels-dashboard.ts. Assert the
      PanelsDashboard class declares 12 readonly panel fields (6 existing +
      6 new). FAIL if fewer than 12.

      STEP 3: Assert renderAll(120, 48) returns a non-empty string with all
      12 panel names referenced in the output (grep for the panel class names
      in the rendered output — they're typically in section headers).

      STEP 4: Adversarial — call renderAll(120, 18) (height below the 24-line
      threshold) and assert the 2×6 fallback layout is used (output should
      have a different shape, no horizontal rule between rows 3/4 since rows
      3+4 are stacked).

      STEP 5: Assert renderRow(0..3, 80, 12) each returns a non-empty string
      and the four outputs have different content (i.e., each row really does
      render different panels).
    timeout_ms: 1800000
