      2. **ForgeStateStore facade** in `store.ts`:
         - `init()` — connects to FORGE_DATABASE_URL, runs `runMigrations()`.
         - `tx<T>(fn: (tx) => Promise<T>): Promise<T>` — wraps a postgres.js
