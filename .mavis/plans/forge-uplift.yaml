  # TRACK 4 — Agent loop refactor (depends on t20 and t30)
  # ════════════════════════════════════════════════════════════════════
  - id: t40-agent-loop
    title: 'agent loop: belief-guided stages, tool-output bounding, permission rules, resumable session'
    assigned_to: general
    depends_on: [t20-belief-graph, t30-verification-planner]
    verified_by: verifier
    timeout_ms: 1800000
    prompt: |
      Refactor packages/forge-agent/src/agent-loop.ts to be belief-guided and
      resumable. Workspace
      /Users/coenhewes/Documents/Forge-code/Forge-coding.

      Current agent loop reads at packages/forge-agent/src/agent-loop.ts (729 lines).
      It already has: state, capability fabric, expansion, finalize. It is
      missing: belief integration, active verification planning, tool-output
      bounding, permission rules, resumability across crashes, durable session
      lifecycle.

      Required deliverables:

      1. **Belief-guided stage machine** — replace the inner loop with explicit
         stages driven by belief + verification state:
         - LOCALIZE: read TaskBeliefState, identify open uncertainties.
         - PROBE:    if any high-uncertainty claim or hypothesis without
                     discriminating evidence exists, request ProbePlanner's top
                     probe as a tool call. Iterate up to N probes per loop pass.
         - EDIT:     once top hypothesis has confidence > threshold, allow
                     write/edit tools.
         - VERIFY:   after each edit, run VerificationPlanner's top action,
                     mark stale claims, update confidence.
         - REPAIR:   if verify fails, run DiagnosticEngine on the failed check
                     to propose a new hypothesis, mark the old one invalid in
                     the belief store, continue from PROBE.
         - FINALIZE: only when VerificationPlanner.canComplete() returns ready
                     (or human-review-required explicitly set).

         Stage transitions emit trace events.

      2. **Resumable session runner** — the loop must survive:
         - Process crash mid-tool-call: persist toolCallId + startedAt before
           invoking the tool; on startup, query `commands` table for
           `status='running'` rows older than threshold and mark them 'interrupted'
           with the partial output captured.
         - Context compaction: when working messages exceed budget, replace
           middle section with a structured summary that references the
           belief-store ids of the dropped facts (so retrieval is exact).
         - Inbox-style prompt resumption: when resuming a session, re-admit
           the prior prompt into the context with a 'resumed' marker.

      3. **Tool-output bounding** — every tool result has a default
         character budget (e.g. 4000 chars in model history; full bytes
         persisted to .forge/artifacts). Add `compactToolResult(content,
         artifactRef, budget)` helper. Wire it into ToolExecutor.

      4. **Permission rules** — extend ToolExecutor with a `PermissionEngine`
         that takes a `PermissionRule[]` (allow/deny/ask patterns matched
         against tool name + arguments). Default rules:
         - allow read_file anywhere
         - allow write_file in active domain's allowed_writes
         - ask run_command if command matches `git push`, `rm -rf`, `sudo`,
           or other destructive patterns
         - deny anything outside active domains' allowed_writes
         Read-only mode (plan/review) denies all write tools.

      5. **State-store integration** — replace the file-based engines'
         stateDir reads with stateStore calls. Keep the existing file-based
         engines as a `LegacyFileStateAdapter` that the stateStore can
         import from on first init (per t10's compat shim). Default mode
         uses Postgres.

      6. **Public API stays stable** — keep AgentLoop.run(task) returning
         AgentResult. Add AgentLoop.resume(taskId) as the new entry point
         for crashed sessions.

