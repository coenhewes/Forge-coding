           written. Add a `tx.trace(event)` helper that inserts into trace_events
           within the same txn; if the txn rolls back, the trace event rolls back too.
         - Repositories are accessed via `store.repos.tasks`, `store.repos.beliefs`, etc.
         - `health()` — returns StateStoreHealth (version, connection count, table counts).
         - `backup(path)`, `restore(path)`, `export(path)` (pg_dump), `import(path)`.
         - `orphanArtifacts()` — find artifacts in .forge/artifacts with no metadata row.

      3. **Artifact store** in `artifact-store.ts` (already exists at 53 lines).
         Wire it to Postgres: write artifact bytes to
         `.forge/artifacts/<taskId>/<artifactId>` (path resolved from
         stateDir default `~/.forge/state`), insert metadata row in `artifacts`
         table with sha256, size, mime, content_hash. `getArtifact(id)` returns
         `{ metadata, bytes }`. Add `pruneOrphans(dryRun=true)` using
         `store.orphanArtifacts()`.

      4. **Trace integration** — every important state write must emit a trace
         event in the SAME transaction as the write. Example pattern:
         ```ts
         await store.tx(async (tx) => {
           await tx.repos.tasks.update(taskId, { status: 'verifying' });
           await tx.trace({ type: 'task_status_changed', taskId, payload: { status: 'verifying' } });
         });
         ```
         Add an explicit note in store.ts docs: "state changes are durable; trace
         events are co-transactional."

