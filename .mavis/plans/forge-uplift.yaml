  - id: t20-belief-graph
    title: 'belief graph: task/repo belief state, probes, truth maintenance, diagnostic updates'
    assigned_to: general
    depends_on: [t10-state-store-impl]
    verified_by: verifier
    timeout_ms: 1800000
    prompt: |
      Promote the @forge/belief package from prototype to control system backed by
      the Postgres state store. Workspace
      /Users/coenhewes/Documents/Forge-code/Forge-coding.

      The existing stubs are at:
        packages/forge-belief/src/graph.ts       (280 lines — TaskBeliefState, Hypothesis)
        packages/forge-belief/src/probes.ts      (92 lines — ProbePlanner)
        packages/forge-belief/src/diagnostics.ts (39 lines — DiagnosticEngine)

      Read them first. Don't throw them away — extend them.

      Required deliverables:

      1. **Persistence layer** — wrap belief state in the state store.
         Add `BeliefStore` class in `packages/forge-belief/src/store.ts` that
         takes `ForgeStateStore` and exposes typed methods:
         - `createTaskBeliefState(taskId, input): Promise<TaskBeliefState>`
         - `loadTaskBeliefState(taskId): Promise<TaskBeliefState | null>`
         - `addHypothesis(taskId, hyp): Promise<Hypothesis>`
         - `updateHypothesis(taskId, hypId, patch): Promise<Hypothesis>`
         - `invalidateHypothesis(taskId, hypId, reason, contradictingEvidenceIds)`
         - `addClaim(taskId, claim): Promise<Claim>`
         - `attachEvidence(taskId, claimId, evidenceId, polarity: 'supports' | 'contradicts'): Promise<void>`
         - `updateClaimConfidence(taskId, claimId, confidence, status): Promise<Claim>`
         - `addContradiction(taskId, claimId, evidenceId, note): Promise<void>`
         - `addProbe(taskId, probe): Promise<ProbeRecommendation>`
         - `recordProbeResult(taskId, probeId, outcome: 'supports' | 'contradicts' | 'inconclusive', notes)`

         All methods MUST go through `stateStore.tx(...)` so the belief state
         and the trace_events row land together.

      2. **Probe planner** — extend the existing probes.ts:
         - Score candidates by: claim importance, confidence gap (1 - current_confidence),
           hypothesis discrimination potential, evidence quality, runtime cost,
           risk of side effects, and flakiness.
         - Return ordered recommendations with the scoring breakdown exposed
           (don't hide the math).
         - Filter out probes that have already been run for the same claim AND
           returned inconclusive (use the state store to check).
         - "Next best probe" = highest-scored candidate that is not blocked.

      3. **Truth maintenance** — add `packages/forge-belief/src/truth.ts`:
         - `runTruthMaintenance(taskId)` — for every claim, recompute confidence
           from current evidence: starts at prior, then for each `supports` adds
           evidence.weight * (1 - prior), for each `contradicts` subtracts
           evidence.weight * prior, clamped to [0,1].
         - Detect contradictions: if a claim has both supporting and contradicting
           evidence, mark it `status: 'conflicted'`.
         - Detect stale: if a claim has no evidence for >24h OR evidence files
           have been edited since attach, mark `status: 'stale'`.
         - Emit trace events for every status change.

      4. **Diagnostic engine** — extend diagnostics.ts:
         - `diagnose(taskId, failedCheck)` — given a failed verification check,
