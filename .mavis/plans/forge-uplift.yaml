  # TRACK 3 — Active verification planner (depends on t10, parallel with t20)
  # ════════════════════════════════════════════════════════════════════
  - id: t30-verification-planner
    title: 'verification planner: candidate actions, evidence-value scorer, claim confidence, stale invalidation'
    assigned_to: general
    depends_on: [t10-state-store-impl]
    verified_by: verifier
    timeout_ms: 1800000
    prompt: |
      Promote @forge/verification-planner from stub to active system. Workspace
      /Users/coenhewes/Documents/Forge-code/Forge-coding.

      Existing:
        packages/forge-verification-planner/src/planner.ts (232 lines)
        packages/forge-verification-planner/src/scorer.ts  (65 lines)

      Required deliverables:

      1. **Candidate action generation** — extend planner.ts:
         - Inputs: acceptance criteria (from state store), changed files,
           affected tests (from @forge/verification), risk areas, belief graph
           open uncertainties, prior failed actions.
         - Outputs: ordered list of `VerificationAction` candidates. Each
           candidate has: type ('test' | 'command' | 'capability' | 'review' |
           'visual' | 'security' | 'migration'), target, rationale,
           expected evidence kind, claimIds addressed.
         - For high-risk tasks (auth, permissions, billing, migrations,
           security, privacy, data deletion, public APIs, multi-tenant,
           secrets, deployment config), at least one candidate MUST be
           a security/review action even if tests pass.

      2. **Evidence-value scorer** — extend scorer.ts:
         Score each candidate by:
         - claim_importance × (1 - current_confidence)       — uncertainty reduction
         - hypothesis_discrimination_potential                 — does it distinguish hypotheses?
         - evidence_quality                                    — direct vs indirect
         - risk                                                — higher risk ⇒ higher weight
         - review_usefulness                                    — does PR benefit?
         - runtime_ms, setup_ms                                — costs (penalty)
         - flakiness_score                                     — penalty (from history)

         Return `EvidenceValueScore` with breakdown. Determinism required
         (same input ⇒ same output).

      3. **Claim confidence updater** — add `packages/forge-verification-planner/src/confidence.ts`:
         - `recordActionResult(taskId, actionId, result)` — takes a verification
           action result (pass/fail/error, evidence id, command output summary),
           updates linked claim confidence in the state store inside one txn,
           emits trace event.
         - Pass with strong evidence ⇒ confidence += (1 - confidence) * 0.5
         - Pass with weak evidence ⇒ confidence += (1 - confidence) * 0.2
         - Fail ⇒ confidence -= confidence * 0.6
         - Multiple passes stabilize; failures don't reset to 0 (so failed
           attempts don't get "punished" too hard).
         - Update belief store's belief graph in the same txn.

      4. **Stale-claim invalidation** — add `packages/forge-verification-planner/src/stale.ts`:
         - `markStaleForChangedFiles(taskId, changedFiles)` — finds all claims
           whose supporting evidence references any of the changed files
           (directly or transitively through the repo graph) and marks them
           `status: 'stale'` if they were previously `verified`.
         - Returns the list of invalidated claims so they re-enter the plan
           queue automatically.

      5. **Completion gating** — add `packages/forge-verification-planner/src/gating.ts`:
         - `canComplete(taskId)` — returns `{ ready: boolean, blockers: string[] }`.
         - All high-risk claims MUST be verified OR marked human-review-required
           before completion. Otherwise `ready: false, blockers: [high-risk
           unverified claims]`.
         - Any stale claim blocks completion until re-verified.
         - Any contradiction blocks completion until resolved.

      6. **Tests** at `tests/verification-planner.test.ts`:
         - Plan candidates for a sample-saas task; assert security review
           candidate is in top 3 for an auth-domain task.
         - Record action result pass → confidence moves up; fail → confidence
           moves down. Two passes do not sum linearly.
         - markStaleForChangedFiles: claim verified earlier, then a file
           it referenced is edited → status flips to stale.
         - canComplete: high-risk unverified claim blocks; human-review
           marked allows.

      Reference: feature_requests/featurerequest3.md (full spec).
      Reference sample fixture: packages/forge-eval/fixtures/sample-saas/

